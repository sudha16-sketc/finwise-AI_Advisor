[package]
name = "finwise-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4", features = ["cookies"] }
actix-cors = "0.7"
actix-session = { version = "0.9", features = ["cookie-session"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

mongodb = "3"
bson = "2"

dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"

bcrypt = "0.15"
anyhow = "1"

reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "1"
futures-util = "0.3"
oauth2 = "4"
[build]
target-dir = "target"

[profile.release]
opt-level = 2

rand = "0.8"